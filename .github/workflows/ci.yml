name: CI

on:
  pull_request:
    branches: [main]
    # Documentation alone needs no build, tests or scan.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Enable and verify pnpm
        id: pnpm
        run: bash .github/scripts/setup-pnpm.sh

      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store-path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Translations
        run: pnpm i18n:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # The build also proves the server bundle: inlined aas-core and the
      # traced PGlite WebAssembly assets (ADR 0011).
      - name: Build
        run: pnpm build

  image:
    name: Container image build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # One platform is enough to prove the image; the workflows that publish
      # build both (docker-snapshot.yml, docker-release.yml).
      - name: Build image (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: basyx-studio:ci
          build-args: |
            STUDIO_VERSION=ci-${{ github.sha }}
            STUDIO_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=studio-image
          cache-to: type=gha,scope=studio-image,mode=max

      # Read-only root file system, uid 1000, base path, no login, a declared
      # infrastructure: health, pages, assets and the API.
      - name: Smoke test
        run: bash .github/scripts/image-smoke-test.sh basyx-studio:ci

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The time series example end to end: InfluxDB 2.7, BaSyx Go, the
      # influxdb2 connection and the bundled Time Series Data app (ADR 0040).
      - name: Time series example
        run: node examples/deployment/time-series/smoke-test.mjs
        env:
          STUDIO_IMAGE: basyx-studio:ci

  integration:
    name: Integration tests against the test environment
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Enable and verify pnpm
        id: pnpm
        run: bash .github/scripts/setup-pnpm.sh

      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store-path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The issuer must resolve to the same address on the runner and, via
      # host-gateway, inside the BaSyx containers (see test-setup/README.md).
      - name: Resolve keycloak.localhost
        run: echo "127.0.0.1 keycloak.localhost" | sudo tee -a /etc/hosts

      - name: Start test environment
        working-directory: test-setup
        run: |
          set -euo pipefail
          docker compose up -d
          for service in postgres keycloak basyx-open basyx-secured; do
            container="$(docker compose ps -q "$service")"
            for attempt in $(seq 1 90); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "$container")"
              if [ "$status" = "healthy" ]; then
                echo "$service is healthy"
                break
              fi
              if [ "$attempt" -eq 90 ]; then
                echo "$service did not become healthy (status: $status)"
                exit 1
              fi
              sleep 2
            done
          done

      - name: Smoke test
        run: pnpm testenv:smoke

      - name: Integration tests
        run: pnpm test:integration

      - name: Local container lifecycle and export/import
        run: STUDIO_CONTAINER_TESTS=1 STUDIO_CONTAINER_COMPOSE_TESTS=1 pnpm exec vitest run test/integration/containers.test.ts

      - name: Build hosted Studio
        run: pnpm build

      # Installable packages of the example apps, used by the app tests (MVP-3).
      - name: Build example apps
        run: pnpm apps:build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests (hosted web)
        run: pnpm test:e2e:web

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-web
          path: |
            playwright-report/web
            test-results/web
          retention-days: 7

      - name: Dump test environment logs on failure
        if: failure()
        working-directory: test-setup
        run: |
          docker compose ps
          docker compose logs --no-color --tail=300

      - name: Stop test environment
        if: always()
        working-directory: test-setup
        run: docker compose down -v

  desktop-e2e:
    name: End-to-end tests of the packaged desktop app (Linux)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Enable and verify pnpm
        id: pnpm
        run: bash .github/scripts/setup-pnpm.sh

      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store-path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A display, a Secret Service for Electron safeStorage (Studio refuses
      # plain-text key storage), and unprivileged user namespaces for the
      # Chromium sandbox, which Ubuntu restricts by default.
      - name: Prepare display, keyring and sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb gnome-keyring dbus-x11
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build the unpacked desktop app
        run: pnpm build:electron:dir --linux --x64

      - name: Build example apps
        run: pnpm apps:build

      - name: End-to-end tests (packaged desktop)
        run: |
          dbus-run-session -- bash -c '
            echo -n "ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            STUDIO_CONTAINER_E2E=1 xvfb-run --auto-servernum pnpm test:e2e:desktop
          '

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-desktop
          path: |
            playwright-report/desktop
            test-results/desktop
          retention-days: 7
